<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks</title><link rel="stylesheet" href="/static/design.css?v=2"><script defer src="/static/app.js?v=2"></script></head>
<body>
<button id="menu" class="menu" aria-label="メニューを開く" aria-expanded="false" aria-controls="sidebar">☰</button>
<aside id="sidebar"><a class="brand" href="#todo"><span class="brandmark" aria-hidden="true">✓</span>Todo App</a><nav aria-label="メイン"><a id="todoNav" href="#todo" aria-current="page"><span aria-hidden="true">☑</span>Todo</a><a id="financeNav" href="#finance" hidden><span aria-hidden="true">▤</span>家計簿</a></nav><div class="account"><span id="role" class="muted">未接続</span><button id="ownerLogin">所有者ログイン</button><button id="logout" hidden>ログアウト</button></div></aside>
<main>
<p id="message" role="status" aria-live="polite"></p>
<section id="login" class="card login" hidden><h1>おかえりなさい</h1><p class="muted">編集する場合は所有者用キーでログインしてください。</p><form id="loginForm"><label for="key">アクセスキー</label><input id="key" type="password" autocomplete="current-password" required maxlength="1024"><button class="primary wide">ログイン</button></form><button id="cancelLogin" type="button" class="wide">閲覧に戻る</button></section>
<section id="workspace" hidden>
<section id="todoView"><header><div><h1>Todo</h1></div><span id="todoCount" class="badge"></span></header>
<section class="card"><form id="addForm" hidden><label for="task">新しいタスク</label><div class="inputrow"><input id="task" placeholder="やることを入力…" maxlength="500" required><button class="primary" aria-label="TODOを追加" title="TODOを追加"><span aria-hidden="true">+</span></button></div></form><nav class="tabs" aria-label="表示するTODO"><button id="openTab" aria-pressed="true">未完了</button><button id="doneTab" aria-pressed="false">完了済み</button></nav><ul id="list"></ul><p id="empty" class="empty" hidden>表示するTodoはありません。</p></section></section>
<section id="financeView" hidden><header><div><h1>家計簿</h1></div><button id="newEntry" class="primary">＋ 記録する</button></header><div class="toolbar"><div class="monthpicker"><button id="prevMonth" aria-label="前の月">‹</button><label for="month" class="sr-only">表示月</label><input id="month" type="month" required min="0001-01" max="9999-12"><button id="nextMonth" aria-label="次の月">›</button></div></div><div class="metrics"><article class="card"><p>収入</p><strong id="income" class="income">—</strong></article><article class="card"><p>支出</p><strong id="expense" class="expense">—</strong></article><article class="card"><p>収支差額</p><strong id="net">—</strong></article></div><section class="card"><div class="sectionhead"><h2>取引履歴</h2><span id="entryCount" class="badge"></span></div><ul id="entries"></ul><p id="financeEmpty" class="empty" hidden>この月の記録はありません。</p></section></section>
</section>
</main>
<dialog id="entryDialog" aria-labelledby="entryHeading"><form id="entryForm"><div class="sectionhead"><h2 id="entryHeading">収支を記録</h2><button type="button" id="closeEntry" aria-label="閉じる">×</button></div><p class="muted">家計簿の記録はログイン不要で公開されます。</p><div class="formgrid"><div><label for="kind">種別</label><select id="kind"><option value="expense">支出</option><option value="income">収入</option></select></div><div><label for="occurred">日付</label><input id="occurred" type="date" required min="0001-01-01" max="9999-12-31"></div></div><label for="entryTitle">内容</label><input id="entryTitle" maxlength="500" placeholder="食費、給与など" required><label for="amount">金額（円）</label><input id="amount" type="number" inputmode="numeric" min="1" max="1000000000" step="1" required><div class="dialogactions"><button type="button" id="cancelEntry">キャンセル</button><button class="primary" id="saveEntry">保存</button></div><p id="entryError" role="alert"></p></form></dialog>
<dialog id="taskDialog" aria-labelledby="taskHeading"><form id="taskEditForm"><h2 id="taskHeading">Todoを編集</h2><label for="editTask">タスク</label><textarea id="editTask" required maxlength="500" rows="3"></textarea><div class="dialogactions"><button type="button" id="cancelTask">キャンセル</button><button class="primary">保存</button></div><p id="taskError" role="alert"></p></form></dialog>
</body></html>
