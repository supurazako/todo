<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks</title><link rel="stylesheet" href="/static/style.css"><script defer src="/static/app.js"></script></head><body><main>
<header><div><p class="eyebrow">SUPURAZAKO</p><h1>Tasks</h1></div><button id="logout" hidden>ログアウト</button></header>
<p id="message" role="status" aria-live="polite"></p>
<section id="login"><h2>アクセスキー</h2><p class="muted">所有者用または閲覧者用のキーを入力してください。</p><form id="loginForm"><label for="key">キー</label><div class="inputrow"><input id="key" type="password" autocomplete="current-password" required maxlength="1024"><button class="primary">ログイン</button></div></form></section>
<section id="workspace" hidden><p id="role" class="muted"></p><form id="addForm" hidden><label for="task">新しいTODO</label><div class="inputrow"><input id="task" placeholder="次にすること" maxlength="500" required><button class="primary">追加</button></div></form><nav aria-label="表示するTODO"><button id="openTab" aria-pressed="true">未完了</button><button id="doneTab" aria-pressed="false">完了済み</button></nav><ul id="list"></ul><p id="empty" class="muted" hidden>ここにはまだTODOがありません。</p></section>
</main></body></html>
